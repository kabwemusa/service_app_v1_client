services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ssm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ssm_db
      POSTGRES_USER: ssm_user
      POSTGRES_PASSWORD: ssm_secret
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssm_user -d ssm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ssm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ssm_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI for viewing emails (OTPs during dev)

  typesense:
    image: typesense/typesense:27.1
    container_name: ssm_typesense
    restart: unless-stopped
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    command: >
      --data-dir /data
      --api-key ${TYPESENSE_API_KEY:-ssm_typesense_dev_key}
      --listen-port 8108
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8108/health | grep -q 'ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted Photon geocoder (v3.2 §3.1), Zambia-tuned.
  # The photon.jar and the search index are provisioned OUT-OF-BAND per
  # PHOTON_GEOCODING_RUNBOOK.md — the build embeds no dump download. Both are
  # bind-mounted from ./infra/photon/: photon.jar and the extracted
  # photon_data/ index (photon_data/elasticsearch/... for the classic build).
  photon:
    image: eclipse-temurin:21-jre # Java 21 base
    container_name: ssm_photon
    restart: unless-stopped
    working_dir: /photon
    command: ["java", "-jar", "photon.jar", "-listen-ip", "0.0.0.0", "-listen-port", "2322"]
    volumes:
      - ./infra/photon/photon.jar:/photon/photon.jar:ro
      - ./infra/photon/photon_data:/photon/photon_data
    ports:
      - "2322:2322"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2322/status | grep -q . || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  typesense_data:
